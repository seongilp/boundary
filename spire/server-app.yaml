apiVersion: v1
kind: ServiceAccount
metadata: { name: server-app, namespace: default }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: server-app, namespace: default, labels: { app: server-app } }
spec:
  replicas: 1
  selector: { matchLabels: { app: server-app } }
  template:
    metadata: { labels: { app: server-app } }
    spec:
      serviceAccountName: server-app
      containers:
        - name: server-app
          image: ghcr.io/spiffe/spire-agent:1.5.1
          command: ["/opt/spire/bin/spire-agent"]
          args: ["api", "watch", "-socketPath", "/run/spire/sockets/agent.sock"]
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath: { path: /run/spire/sockets, type: Directory }
